# Compile l'application Android TinOR et la publie : chaque build sur main crée
# une version « android-vN » dont l'APK est téléchargeable directement depuis le
# téléphone. Lien stable vers la dernière version :
#   https://github.com/<propriétaire>/<dépôt>/releases/latest/download/TinOR.apk
name: Application Android

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'admin/**'
      - '.github/workflows/android.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # Le SDK Android est préinstallé sur les machines ubuntu de GitHub ($ANDROID_HOME).
      - uses: gradle/actions/setup-gradle@v4

      # Clé de publication facultative (secrets du dépôt) ; sans elle, la clé
      # android/app/tinor-debug.keystore du dépôt est utilisée.
      - name: Clé de signature
        env:
          KEYSTORE_BASE64: ${{ secrets.TINOR_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tinor-release.keystore"
            echo "TINOR_KEYSTORE_FILE=$RUNNER_TEMP/tinor-release.keystore" >> "$GITHUB_ENV"
            echo "Clé de publication utilisée."
          else
            echo "Pas de secret TINOR_KEYSTORE_BASE64 : clé debug du dépôt utilisée."
          fi

      - name: Compilation de l'APK
        env:
          TINOR_VERSION_CODE: ${{ github.run_number }}
          TINOR_KEYSTORE_PASSWORD: ${{ secrets.TINOR_KEYSTORE_PASSWORD }}
          TINOR_KEY_ALIAS: ${{ secrets.TINOR_KEY_ALIAS }}
          TINOR_KEY_PASSWORD: ${{ secrets.TINOR_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/TinOR.apk"
          ls -la "$GITHUB_WORKSPACE/TinOR.apk"

      - name: Vérification de l'APK
        run: |
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs "$GITHUB_WORKSPACE/TinOR.apk" | head -3
          "$BT/aapt2" dump badging "$GITHUB_WORKSPACE/TinOR.apk" | head -3
          unzip -l "$GITHUB_WORKSPACE/TinOR.apk" | grep -E "assets/(tinor_admin.html|tinor-android.js)"

      - uses: actions/upload-artifact@v4
        with:
          name: TinOR-apk
          path: TinOR.apk

      - name: Publication (version téléchargeable)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v${{ github.run_number }}
          name: TinOR Android — version ${{ github.run_number }}
          make_latest: true
          files: TinOR.apk
          body: |
            Application Android TinOR (console de gestion).

            **Installation sur le téléphone** : ouvrir ce lien depuis Android, télécharger
            `TinOR.apk`, puis l'ouvrir (autoriser « Installer des applications inconnues »
            pour le navigateur si Android le demande). Les versions suivantes s'installent
            par-dessus, sans perdre l'adresse de l'API.

            Commit : ${{ github.sha }}
