      <!-- ===== STOCK — MOUVEMENTS ===== -->
      <div class="view" id="view-stock-mouvements">
        <div class="pageHead" style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div><h1>Stock — Mouvements</h1><p>Historique complet, généré automatiquement par les autres modules — 500 derniers</p></div>
          <div style="display:flex; gap:8px;">
            <button class="btnGhost" id="mouvementsExportDocxBtn">⬇ DOCX</button>
            <button class="btnGhost" id="mouvementsExportXlsxBtn">⬇ XLSX</button>
            <button class="btnGhost" id="mouvementsExportPdfBtn">⬇ PDF</button>
          </div>
        </div>
        <div class="panel">
          <div class="panelHead">
            <div class="filterRow">
              <span class="chip active" data-filter="">Tous</span>
              <span class="chip" data-filter="ENTREE">Entrées</span>
              <span class="chip" data-filter="SORTIE">Sorties</span>
            </div>
          </div>
          <div style="padding:0 18px 14px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
            <div style="flex:1; min-width:200px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Produit ou N° de lot</label>
              <input type="text" id="mouvementsFilterTexte" class="formInput" placeholder="ex: Sésame ou 01-MP-001">
            </div>
            <div style="min-width:150px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Du</label>
              <input type="date" id="mouvementsFilterDateDebut" class="formInput">
            </div>
            <div style="min-width:150px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Au</label>
              <input type="date" id="mouvementsFilterDateFin" class="formInput">
            </div>
            <button class="btnGhost" id="mouvementsFilterResetBtn">✕ Réinitialiser</button>
          </div>
          <table>
            <thead><tr><th>Date</th><th>Type</th><th>Sens</th><th>Produit</th><th>N° Lot</th><th class="num">Quantité</th><th>Origine</th></tr></thead>
            <tbody id="stockMouvementsBody"><tr><td colspan="7" class="rowMeta" style="text-align:center; padding:22px;">Chargement…</td></tr></tbody>
          </table>
        </div>
      </div>
