      <!-- ===== HISTORIQUE DE PRODUCTION ===== -->
      <div class="view" id="view-historique-prod">
        <div class="pageHead" style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div><h1>Historique de production</h1><p>Ordres de production lancés à partir des recettes</p></div>
          <div style="display:flex; gap:8px;">
            <button class="btnGhost" id="historiqueExportDocxBtn">⬇ DOCX</button>
            <button class="btnGhost" id="historiqueExportXlsxBtn">⬇ XLSX</button>
            <button class="btnGhost" id="historiqueExportPdfBtn">⬇ PDF</button>
          </div>
        </div>
        <div class="panel" style="margin-bottom:0;">
          <div style="padding:14px 18px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
            <div style="flex:1; min-width:200px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Produit ou N° de lot</label>
              <input type="text" id="historiqueFilterTexte" class="formInput" placeholder="ex: Savon">
            </div>
            <div style="min-width:150px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Du</label>
              <input type="date" id="historiqueFilterDateDebut" class="formInput">
            </div>
            <div style="min-width:150px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Au</label>
              <input type="date" id="historiqueFilterDateFin" class="formInput">
            </div>
            <button class="btnGhost" id="historiqueFilterResetBtn">✕ Réinitialiser</button>
          </div>
        </div>
        <div class="panel">
          <table>
            <thead><tr><th>N° Lot</th><th>Produit</th><th>Date</th><th class="num">Quantité produite</th><th>Employé</th></tr></thead>
            <tbody id="ordresProductionBody"><tr><td colspan="5" class="rowMeta" style="text-align:center; padding:22px;">Chargement…</td></tr></tbody>
          </table>
        </div>
      </div>
