<!-- ============ MODALE : RÉPARTITION D'UN LOT ============ -->
<div class="modalOverlay" id="repartitionModalOverlay">
  <div class="modal" style="max-width:560px;">
    <div class="modalHead">
      <div><h2 id="repartitionModalTitle">Répartition du lot</h2><div class="sub">Tous les mouvements de stock — entrées et sorties</div></div>
      <button class="modalClose" id="repartitionModalCloseBtn">×</button>
    </div>
    <div style="padding:16px 20px; max-height:65vh; overflow-y:auto;">
      <div id="repartitionBanner" style="margin-bottom:14px;"></div>
      <table style="width:100%;">
        <thead><tr>
          <th style="text-align:left; font-size:10.5px; color:var(--text-soft);">Date</th>
          <th style="text-align:left; font-size:10.5px; color:var(--text-soft);">Type</th>
          <th style="text-align:left; font-size:10.5px; color:var(--text-soft);">Sens</th>
          <th style="text-align:right; font-size:10.5px; color:var(--text-soft);">Quantité</th>
          <th style="text-align:left; font-size:10.5px; color:var(--text-soft);">Origine</th>
        </tr></thead>
        <tbody id="repartitionBody"></tbody>
      </table>
      <div id="repartitionEmpty" class="rowMeta" style="display:none; text-align:center; padding:20px;">Aucun mouvement enregistré pour ce lot.</div>
    </div>
    <div class="modalFoot">
      <span></span>
      <button class="btnGhost" id="repartitionCloseFooterBtn">Fermer</button>
    </div>
  </div>
</div>
