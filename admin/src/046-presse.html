      <!-- ===== PRESSE ===== -->
      <div class="view" id="view-presse">
        <div class="pageHead" style="display:flex; justify-content:space-between; align-items:flex-end;">
          <div><h1>Lots de presse</h1><p>Pressage d'une matière première en huile vrac</p></div>
          <div style="display:flex; gap:8px;">
            <button class="btnGhost" id="presseExportDocxBtn">⬇ DOCX</button>
            <button class="btnGhost" id="presseExportXlsxBtn">⬇ XLSX</button>
            <button class="btnGhost" id="presseExportPdfBtn">⬇ PDF</button>
          </div>
        </div>
        <div class="panel" style="margin-bottom:0;">
          <div style="padding:14px 18px; display:flex; gap:10px; flex-wrap:wrap; align-items:flex-end;">
            <div style="flex:1; min-width:200px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Produit ou N° de lot</label>
              <input type="text" id="presseFilterTexte" class="formInput" placeholder="ex: Sésame ou 03-P-001">
            </div>
            <div style="min-width:150px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Du</label>
              <input type="date" id="presseFilterDateDebut" class="formInput">
            </div>
            <div style="min-width:150px;">
              <label style="display:block; font-size:11px; color:var(--text-soft); margin-bottom:5px;">Au</label>
              <input type="date" id="presseFilterDateFin" class="formInput">
            </div>
            <button class="btnGhost" id="presseFilterResetBtn">✕ Réinitialiser</button>
          </div>
        </div>
        <div class="panel">
          <table>
            <thead><tr><th>N° Lot</th><th>Produit</th><th>Date</th><th class="num">Matière util.</th><th class="num">Tourteau</th><th class="num">Produit</th><th class="num">Rendement</th><th>Employé</th><th></th></tr></thead>
            <tbody id="presseBody"><tr><td colspan="9" class="rowMeta" style="text-align:center; padding:22px;">Chargement…</td></tr></tbody>
          </table>
        </div>
      </div>
