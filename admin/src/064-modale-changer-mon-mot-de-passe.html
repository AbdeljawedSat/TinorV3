<!-- ============ MODALE : CHANGER MON MOT DE PASSE ============ -->
<div class="modalOverlay" id="mdpModalOverlay">
  <div class="modal" style="max-width:420px;">
    <div class="modalHead">
      <div><h2>Changer mon mot de passe</h2><div class="sub" id="mdpSousTitre">Compte TinOR</div></div>
      <button class="modalClose" id="mdpModalCloseBtn">×</button>
    </div>
    <div style="padding:6px 20px 16px;">
      <div id="mdpAlerte" class="derivesAide" style="display:none; margin:10px 0 0;"></div>
      <div id="mdpFormError" style="color:var(--danger); font-size:11.5px; margin:10px 0 0; display:none;"></div>
      <label class="formLbl">Mot de passe actuel</label>
      <input type="password" id="mdpAncien" class="formInput" autocomplete="current-password">
      <label class="formLbl">Nouveau mot de passe (10 caractères minimum)</label>
      <input type="password" id="mdpNouveau" class="formInput" autocomplete="new-password">
      <label class="formLbl">Confirmer le nouveau mot de passe</label>
      <input type="password" id="mdpConfirmation" class="formInput" autocomplete="new-password">
    </div>
    <div class="modalFoot">
      <button class="btnGhost" id="mdpCancelBtn">Plus tard</button>
      <button class="btnPrimary" id="mdpSaveBtn">Changer le mot de passe</button>
    </div>
  </div>
</div>
