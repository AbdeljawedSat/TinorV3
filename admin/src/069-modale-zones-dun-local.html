<!-- ============ MODALE : ZONES D'UN LOCAL ============ -->
<div class="modalOverlay" id="zonesModalOverlay">
  <div class="modal" style="max-width:440px;">
    <div class="modalHead">
      <div><h2 id="zonesModalTitle">Zones</h2><div class="sub">Emplacements internes de ce local</div></div>
      <button class="modalClose" id="zonesModalCloseBtn">×</button>
    </div>
    <div style="padding:16px 20px; max-height:50vh; overflow-y:auto;">
      <div id="zonesFormError" style="color:var(--danger); font-size:11.5px; margin-bottom:10px; display:none;"></div>
      <table style="width:100%; margin-bottom:14px;" id="zonesTable">
        <thead><tr><th style="text-align:left; font-size:10.5px; color:var(--text-soft);">Code</th><th style="text-align:left; font-size:10.5px; color:var(--text-soft);">Nom</th></tr></thead>
        <tbody id="zonesBody"></tbody>
      </table>
      <label class="formLbl">Ajouter une zone — code</label>
      <input type="text" id="zoneNewCode" class="formInput" placeholder="ex: Z1" style="margin-bottom:8px;">
      <label class="formLbl">Nom</label>
      <input type="text" id="zoneNewNom" class="formInput" placeholder="ex: Zone Pressage">
      <button class="btnGhost" id="zoneAddBtn" style="margin-top:10px;">＋ Ajouter cette zone</button>
    </div>
    <div class="modalFoot">
      <span></span>
      <button class="btnPrimary" id="zonesCloseFooterBtn">Terminé</button>
    </div>
  </div>
</div>
